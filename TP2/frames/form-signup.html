<section class="form-container" id="form">
    <form class="form-container" id="logUp-form">
        <img src="assets/images/close-cross.svg" alt="close form" id="close-form">
        <label>Nombre <span>*</span></label>
        <input type="text" name="firstname" id="firstname" placeholder="Ingrese su nombre" required>
        <label>Apellido<span>*</span></label>
        <input type="text" name="lastname" id="lastname" placeholder="Ingrese su apellido" required>
        <label>Nombre de Usuario<span>*</span></label>
        <input type="text" name="username" id="username" placeholder="ingrese un nombre de usuario" required>
        <label>Nacimiento<span>*</span></label>
        <input type="date" name="birth" id="birth-date" title="Fecha de Nacimiento" placeholder="Ingrese su fecha de nacimiento" required>
        <div class="error-message" id="age-error"></div>
        <label>Email<span>*</span></label>
        <input type="email" name="email" id="email" placeholder="Ingrese su correo electrónico" required>
        <label>Contraseña<span>*</span></label>
        <input type="password" name="password-1" id="password-1" placeholder="Ingrese una contraseña" required>
        <input type="password" name="password-2" id="password-2" placeholder="Repita su contraseña" required>
        <div class="error-message" id="password-error"></div>
        <h4>¿Ya tienes cuenta? <a href="#" id="sign-in">Iniciar Sesión</a></h4>
        <button type="submit" id="signUp-submit">Registrarse</button>
    </form>
    <div class="success-message" id="successMessage" role="alert" aria-hidden="true">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" width="50" height="50">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
          </svg>
        </div>
        <p class="message"></p>
    </div>
</section>
