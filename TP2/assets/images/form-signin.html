<section class="form-container" id="form">
    <form action="" id="login-form">
        <img src="assets/images/close-cross.svg" alt="close form" id="close-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Ingrese su correo electrónico" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña" required>
        <div id="botones-inicio-sesion">
            <button id="google-button" type="button"></button>
            <button id="facebook-button" type="button"></button>
        </div>
        <div id="reCaptcha">
            <button id="re-captcha" type="button"></button>
        </div>
        <h4>¿Aún no tienes una cuenta? <a href="#" id="sign-up">Registrarme</a></h4>
        <button type="submit" id="signIn-submit">Iniciar Sesión</button>
    </form>
    <div class="success-message" id="successMessage" role="alert" aria-hidden="true">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" width="50" height="50">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
          </svg>
        </div>
        <p class="message"></p>
    </div>      
<style>
    #reCaptcha {
        width: 372px; 
        height: 76px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #re-captcha {
        background-image: url("assets/test/image.png");
        background-size: contain; 
        background-repeat: no-repeat;
        background-position: center;
        background-color: white;
        width: 100%;
        height: 100%;
        border: none;
        cursor: pointer;
    }
    #google-button {
        background-image: url("assets/images/google-button.svg");
        background-size: cover;
        width: 100%;
        height: 100%;
        border-bottom: 1.5px solid black;
        cursor: pointer;
        opacity: 1;
        mix-blend-mode: normal;
        transition: opacity 0.3s, mix-blend-mode 0.3s;
    }

    #google-button:hover {
        background-image: url("assets/images/google-button-hover.svg");
        mix-blend-mode: exclusion; /* Aplica el efecto "Exclusion" */
    }

    #facebook-button {
        background-image: url("assets/images/facebook-button.svg");
        background-size: cover;
        width: 100%;
        height: 100%;
        border: none;
        cursor: pointer;
        border-radius: 10px;
    }

    #facebook-button:hover{
        background-image: url("assets/images/facebook-button-hover.svg");
    }

    #botones-inicio-sesion{
        display: flex;
        flex-direction: row;
        width: 85%;
        height: 40px;
        gap: 15px;
    }

    .page_content {
        min-height: 730px;
    }
    .form-container {
        color: black;
        width: 450px;
        height: fit-content;
        background-color: #fff;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .form-container form img {
        position: absolute; 
        width: 25px; 
        padding: 0 !important; 
        margin: 0 !important; 
        top: 3%; right: 3%; 
        opacity: 50%;
    }
    .form-container form img:hover {
        opacity: 100%;
        cursor: pointer;
    }

    .form-container form {
        display: flex;
        flex-direction: column;
        align-items: center; /* Centra horizontalmente los inputs y labels */
        gap: 15px;
        width: 100%; /* Asegura que el formulario ocupe todo el ancho disponible */
        padding: 5% 0 5% 0 !important;
    }

    .form-container label {
        font-size: 14px;
        color: #333;
        text-align: left;
        width: 85%;
    }

    .form-container label span {
        color: red;
    }
    .form-container label span:hover {
        cursor: pointer;
    }

    .form-container form input {
        padding: 10px !important;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        width: 85%;
        margin: 0 auto; /* Centra el input horizontalmente */
    }

    input:focus {
        border-color: #007bff;
        outline: none;
    }

    .form-container h4 {
        font-weight: lighter;
    }

    .form-container button {
        font-display: grid;
        background-color: #2C2C2C;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        width: 60%;
        height: 40px;
    }

    .form-container button:hover {
        background-color: #0056b3;
    }

    .input-warning {
        border-color: rgb(162, 55, 55) !important;
    }
    
    
</style>
    <script type="module" src="../js/userSystem.js"></script>
</section>
